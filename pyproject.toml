[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lzrans"
version = "0.1.0"
description = "LZ77 (64 KB hash-chain) + 3-stream rANS compressor with a C core"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["lzrans"]

[tool.pytest.ini_options]
testpaths = ["tests"]
