[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lzrans"
version = "0.4.0.dev0"
description = "Streaming LZ77 + rANS compressor with a C core"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["lzrans"]

[tool.pytest.ini_options]
testpaths = ["tests"]
